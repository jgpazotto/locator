<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Locator</title>
<meta name="theme-color" content="#e0600f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Locator">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f5f4f0; --panel:#ffffff; --ink:#1d2126; --muted:#646a70; --line:#dedbd3;
  --accent:#e0600f; --accent-soft:#fbe7d8; --ok:#2f7d4f; --ok-soft:#dff1e6; --warn:#b3261e; --warn-soft:#fbe3e1;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme:dark;
    --bg:#15181b; --panel:#1e2226; --ink:#eceae4; --muted:#9aa0a6; --line:#33383d;
    --accent:#f7843a; --accent-soft:#3a2618; --ok:#5cc08a; --ok-soft:#1c3326; --warn:#ff8a80; --warn-soft:#3b1f1d; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:20px 72px;display:flex;flex-direction:column;gap:18px}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted)}
input,select,textarea,button{font:inherit;color:var(--ink)}
input[type=date],input[type=number],input[type=text],input[type=email],input[type=tel],input[type=password],select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
textarea{width:100%;min-height:130px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--mono);font-size:13px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);padding:7px 12px;font-weight:600}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button.link{border:none;background:none;padding:4px 6px;color:var(--muted);font-weight:500;font-size:13px}
button.link.danger{color:var(--warn)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;overflow-x:auto}
.tabs button{flex:1;border:none;background:transparent;padding:9px 6px;font-size:14px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
.weeknav{display:flex;align-items:center;gap:10px;justify-content:space-between}
.weeknav .mid{text-align:center}
.weeknav .mid b{display:block;font-size:18px}
.weeknav button{min-width:44px;font-size:18px;padding:6px 10px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tile{background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.tile b{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.tile.hl b{color:var(--accent)}
.tile input{width:100%;font-family:var(--mono);font-size:18px;font-weight:600;padding:3px 6px}
.pos{color:var(--ok)} .neg{color:var(--warn)}
@media (max-width:680px){.tiles{grid-template-columns:repeat(2,1fr)}.tile.wide{grid-column:1/-1}}
.days{display:flex;flex-direction:column;gap:6px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.day.off{background:transparent;border-style:dashed}
.day-sum{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;padding:11px 14px;width:100%;border:none;border-radius:0;background:transparent;text-align:left;font-weight:400}
button.day-sum:hover{background:var(--accent-soft)}
.day-sum .d b{font-weight:600}
.day-sum .d small{color:var(--muted);font-size:12px}
.day-sum .amt{font-family:var(--mono);font-weight:600;color:var(--accent)}
.day-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:14px}
.rep-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);padding-top:6px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
td.money{font-weight:600;color:var(--accent)}
tr.total td{font-weight:700;border-bottom:none}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--warn-soft);color:var(--warn)}
.dup{color:var(--warn);font-size:12px;font-weight:600}
.paste-head{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:10px}
.paste-head label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.paste-head input[type=date]{font-size:16px}
.draft{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.bal{font-family:var(--mono);font-size:32px;font-weight:600}
.form{display:grid;grid-template-columns:150px 1fr 120px auto auto;gap:8px;align-items:center}
@media (max-width:680px){.form{grid-template-columns:1fr 1fr}.form .desc{grid-column:1/-1;order:-1}}
.rules{display:flex;flex-wrap:wrap;gap:14px 24px}
.rules label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.in{display:flex;align-items:center;gap:4px;color:var(--ink);font-family:var(--mono)}
.rules input{width:110px}
.empty{color:var(--muted);padding:18px;text-align:center}
.sec{display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:9;max-width:90vw}
/* telas de entrada */
.auth{max-width:420px;margin:0 auto;padding:40px 16px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:8px 16px;font-weight:600;color:var(--ink);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--accent);color:#fff}
.brand img{width:48px;height:48px;border-radius:12px}
.fields{display:flex;flex-direction:column;gap:10px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.fields .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields input{width:100%;font-size:16px}
.switch{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.switch button{flex:1;border:none;background:transparent}
.switch button[aria-selected="true"]{background:var(--accent);color:#fff}
.msg{padding:12px 14px;border-radius:8px;background:var(--accent-soft);font-size:14px}
.msg.ok{background:var(--ok-soft)} .msg.bad{background:var(--warn-soft);color:var(--warn)}
.langSel{padding:5px 8px;font-size:13px}
.locbox{display:flex;flex-direction:column;gap:4px}
.locbox .lbl{font-size:13px;font-weight:600;color:var(--muted)}
.locfixed{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--accent-soft)}
.editor input{padding:6px 8px}
.trial{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);margin-bottom:14px;font-size:15px}
.trial details{width:100%}
.trial.warn{background:var(--warn-soft);color:var(--warn)}
.wafab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:50;text-decoration:none}
.wafab svg{width:30px;height:30px}
.trial summary{cursor:pointer;font-weight:700;color:var(--accent)}
.paybox{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.paybox .opt{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.paybox .opt b{display:block;margin-bottom:2px}
.wa{display:inline-flex;align-items:center;gap:8px;background:#25d366;color:#fff;border-radius:10px;padding:11px 16px;font-weight:700;text-decoration:none;align-self:flex-start}
.welcome{background:var(--panel);border:2px solid var(--accent);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.welcome ol{margin:8px 0 12px;padding-left:22px}.welcome li{margin:6px 0}
.exp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sumbox{margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.codebox{font:700 22px var(--mono);letter-spacing:.12em;background:var(--accent-soft);border-radius:8px;padding:6px 12px;display:inline-block}
.alertbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.alertbox ul{margin:6px 0 0;padding-left:20px}
.rules input:disabled,.rules select:disabled{opacity:.6}
.langBig{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;font-size:18px;font-weight:600;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);cursor:pointer;text-align:left}
.langBig span{font-size:28px;line-height:1}
.langBig:hover,.langBig:focus-visible{border-color:var(--accent);background:var(--accent-soft)}
</style>
</head>
<body>

<!-- ===================== ESCOLHA DO IDIOMA (1ª vez) ===================== -->
<div id="scrLang" class="auth" hidden>
  <div class="brand"><img src="icon-192.png?v=2" alt=""><h1>Loca<span>tor</span></h1></div>
  <div class="panel" style="display:flex;flex-direction:column;gap:12px">
    <h2 style="margin:0">Choose your language</h2>
    <p class="note" style="margin:0">Escolha seu idioma · Elige tu idioma</p>
    <button type="button" class="langBig" data-pick="en"><span>🇺🇸</span>English</button>
    <button type="button" class="langBig" data-pick="pt"><span>🇧🇷</span>Português</button>
    <button type="button" class="langBig" data-pick="es"><span>🇪🇸</span>Español</button>
  </div>
</div>

<!-- ===================== ENTRAR / CADASTRO ===================== -->
<div id="scrAuth" class="auth" hidden>
  <div class="row" style="justify-content:space-between">
    <div class="brand"><img src="icon-192.png?v=2" alt=""><div><h1>Loca<span>tor</span></h1><div class="note" data-i18n="tagline"></div></div></div>
    <select class="langSel" aria-label="Idioma / Language"></select>
  </div>
  <div class="switch" role="tablist">
    <button type="button" id="swLogin" aria-selected="true" data-i18n="login"></button>
    <button type="button" id="swSign" aria-selected="false" data-i18n="signup"></button>
  </div>
  <form id="fLogin" class="fields">
    <label><span data-i18n="email"></span><input type="email" id="lEmail" autocomplete="email" required></label>
    <label><span data-i18n="password"></span><input type="password" id="lPass" autocomplete="current-password" required></label>
    <button type="submit" class="primary" data-i18n="login"></button>
    <button type="button" class="link" id="forgot" data-i18n="forgot"></button>
  </form>
  <form id="fSign" class="fields" hidden>
    <div class="two">
      <label><span data-i18n="firstName"></span><input type="text" id="sNome" autocomplete="given-name" required></label>
      <label><span data-i18n="lastName"></span><input type="text" id="sSobre" autocomplete="family-name" required></label>
    </div>
    <label><span data-i18n="phone"></span><input type="tel" id="sTel" autocomplete="tel" placeholder="(512) 555-0100" required></label>
    <label><span data-i18n="teamCodeOpt"></span><input type="text" id="sTeam" autocomplete="off" maxlength="8" style="text-transform:uppercase" placeholder="ABC123"></label>
    <label><span data-i18n="email"></span><input type="email" id="sEmail" autocomplete="email" required></label>
    <label><span data-i18n="passwordNew"></span><input type="password" id="sPass" autocomplete="new-password" minlength="6" required></label>
    <button type="submit" class="primary" data-i18n="signup"></button>
    <p class="note" data-i18n="signupNote"></p>
  </form>
  <div id="authMsg" class="msg" hidden></div>
</div>

<!-- ===================== AGUARDANDO LIBERAÇÃO ===================== -->
<div id="scrWait" class="auth" hidden>
  <div class="row" style="justify-content:space-between">
    <div class="brand"><img src="icon-192.png?v=2" alt=""><h1>Loca<span>tor</span></h1></div>
    <select class="langSel" aria-label="Idioma / Language"></select>
  </div>
  <div class="panel">
    <h2 id="waitTitle"></h2>
    <p id="waitText"></p>
    <div class="msg" id="payInfo"></div>
  </div>
  <div class="row"><button type="button" class="primary" id="recheck" data-i18n="recheck"></button><button type="button" class="link" data-logout data-i18n="logout"></button></div>
</div>

<!-- ===================== APP ===================== -->
<div id="scrApp" class="wrap" hidden>
  <header class="top">
    <div class="brand"><img src="icon-192.png?v=2" alt=""><h1>Loca<span>tor</span></h1><p class="note" id="ruleLine" hidden></p></div>
    <div class="row"><span class="note" id="who"></span><a class="link" href="../guide.html" target="_blank" rel="noopener" data-i18n="helpLink"></a><select class="langSel" aria-label="Idioma / Language"></select><button type="button" class="link" data-logout data-i18n="logout"></button></div>
  </header>

  <div id="trialBar" class="trial" hidden></div>
  <div id="welcome" class="welcome" hidden>
    <h2 style="margin:0 0 4px" data-i18n="wcTitle"></h2>
    <p class="note" style="margin:0" id="wcTrial"></p>
    <ol><li data-i18n="wc1"></li><li data-i18n="wc2"></li><li data-i18n="wc3"></li><li data-i18n="wc4"></li></ol>
    <div class="row" style="gap:10px;flex-wrap:wrap"><button type="button" class="primary" id="wcOk" data-i18n="wcOk"></button><a class="link" href="../guide.html" target="_blank" rel="noopener" data-i18n="helpLink"></a></div>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button type="button" role="tab" data-tab="semana" aria-selected="true" data-i18n="tabWeek"></button>
    <button type="button" role="tab" data-tab="resumo" aria-selected="false" data-i18n="tabSummary"></button>
    <button type="button" role="tab" data-tab="caixa" aria-selected="false" data-i18n="tabCash"></button>
    <button type="button" role="tab" data-tab="regras" aria-selected="false" data-i18n="tabRules"></button>
    <button type="button" role="tab" data-tab="equipe" aria-selected="false" id="tabTeam" hidden data-i18n="tabTeam"></button>
    <button type="button" role="tab" data-tab="admin" aria-selected="false" id="tabAdmin" hidden data-i18n="tabAdmin"></button>
  </nav>

  <section id="tab-semana" class="sec">
    <div class="weeknav">
      <button type="button" id="prevW" aria-label="‹">‹</button>
      <div class="mid"><b id="wTitle"></b><span class="note" id="wRange"></span></div>
      <button type="button" id="nextW" aria-label="›">›</button>
    </div>
    <div class="tiles" id="wTiles"></div>
    <div class="days" id="days"></div>
    <div class="panel">
      <h2 data-i18n="pasteTitle"></h2>
      <div class="paste-head">
        <label for="pDate"><span data-i18n="serviceDay"></span><input type="date" id="pDate"></label>
        <div class="locbox"><span class="lbl" data-i18n="location"></span><span id="locFixed" class="locfixed" hidden><b id="locFixedTxt"></b> <button type="button" class="link" id="locChange" data-i18n="change"></button></span><input type="text" id="pLoc" list="locList" autocomplete="off" style="min-width:210px"></div>
        <span class="note" id="pDateHint"></span>
      </div>
      <datalist id="locList"></datalist>
      <textarea id="paste" placeholder="Report | Name | 7 Tickets
2674509093 3.090 ft
2674950133 505 ft
2674487790 100 ft
..."></textarea>
      <div id="drafts"></div>
    </div>
  </section>

  <section id="tab-resumo" class="sec" hidden>
    <div class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <div class="seg" role="tablist" id="perSel"><button type="button" data-per="dia" aria-selected="true" data-i18n="pDay"></button><button type="button" data-per="semana" aria-selected="false" data-i18n="pWeek"></button><button type="button" data-per="mes" aria-selected="false" data-i18n="pMonth"></button></div>
        <span class="exp"><select id="expPer" aria-label="período"><option value="dia" data-i18n="pDay"></option><option value="semana" data-i18n="pWeek"></option><option value="mes" data-i18n="pMonth"></option><option value="tudo" data-i18n="pAll"></option></select><select id="expWhich" aria-label="qual"></select><button type="button" id="expGo" class="primary" data-i18n="exportX"></button><button type="button" id="expPdf" data-i18n="exportPdf"></button></span>
      </div>
      <div class="tbl-wrap" id="weeksTable"></div>
      <p class="note" data-i18n="summaryNote"></p>
    </div>
    <div class="panel">
      <h2 data-i18n="byLocation"></h2>
      <div class="tbl-wrap" id="locTable"></div>
    </div>
  </section>

  <section id="tab-caixa" class="sec" hidden>
    <div class="panel">
      <h2 data-i18n="cashBalance"></h2>
      <div class="bal" id="cxBal"></div>
      <p class="note" data-i18n="cashNote"></p>
    </div>
    <div class="panel">
      <h2 data-i18n="cashAdd"></h2>
      <form class="form" id="cxForm">
        <input type="date" id="cxDate">
        <input type="text" id="cxDesc" class="desc">
        <input type="number" id="cxVal" step="0.01" min="0" inputmode="decimal" placeholder="$">
        <select id="cxType"><option value="out" data-i18n="expense"></option><option value="in" data-i18n="income"></option></select>
        <button type="submit" class="primary" data-i18n="add"></button>
      </form>
    </div>
    <div class="panel"><h2 data-i18n="moves"></h2><div class="tbl-wrap" id="cxList"></div></div>
  </section>

  <section id="tab-regras" class="sec" hidden>
    <div class="panel" id="teamPanel"></div>
    <div class="panel">
      <h2 data-i18n="payRules"></h2>
      <div class="rules">
        <label for="rTicket"><span data-i18n="perTicket"></span><span class="in">$<input id="rTicket" type="number" min="0" step="0.5"></span></label>
        <label for="rSize"><span data-i18n="blockSize"></span><span class="in"><input id="rSize" type="number" min="1" step="1"> ft</span></label>
        <label for="rCar"><span data-i18n="carWeek"></span><span class="in">$<input id="rCar" type="number" min="0" step="1"></span></label>
        <label for="rStart"><span data-i18n="startWeek1"></span><span class="in"><input id="rStart" type="date"></span></label>
        <label for="rClose"><span data-i18n="weekClose"></span><span class="in"><select id="rClose"></select></span></label>
      </div>
      <div class="sumbox">
        <label class="row" style="gap:8px;align-items:center;cursor:pointer"><input type="checkbox" id="rSumOn" style="width:20px;height:20px"> <b data-i18n="sumOn"></b></label>
        <label for="rSumFrom" class="row" style="gap:8px;align-items:center;margin-top:6px" id="rSumFromWrap"><span class="note" data-i18n="sumFrom"></span><input type="date" id="rSumFrom"></label>
        <p class="note" style="margin:6px 0 0" data-i18n="sumNote"></p>
      </div>
      <h2 style="margin-top:20px" data-i18n="ratePeriods"></h2>
      <div class="tbl-wrap" id="ratesTable"></div>
      <div class="row" style="margin-top:10px">

const $ = s => document.querySelector(s);

const money = n => (n<0?"−$":"$") + Math.abs(Math.round(n*100)/100).toLocaleString(LOCALE(),{minimumFractionDigits:0,maximumFractionDigits:2});
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseISO = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); };

const DOW = i => T("dow")[i];
const dLabel = s => { const d=parseISO(s), m=T("mon")[d.getMonth()]; return lang==="en" ? `${m} ${d.getDate()}` : `${d.getDate()} ${m}`; };
const dFull = s => s ? `${dLabel(s)} ${s.slice(0,4)}` : "—";
const weekStart = s => { const wd=(typeof rules!=="undefined"&&rules.wd)||0; const d=parseISO(s); d.setDate(d.getDate()-((d.getDay()-wd+7)%7)); return iso(d); };
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2800); }

/* ---------- regras de cálculo ---------- */
const rateFor = date => { const rs=[...rules.rates].sort((a,b)=>a.from.localeCompare(b.from)); let r=rs[0]?.block ?? 0; for(const x of rs) if(x.from<=date) r=x.block; return r; };
const cotas = ft => Math.max(0, Math.floor((+ft||0)/rules.size));
const tCount = r => Math.max(+r.declared||0, r.tickets.length);
const sumMode = date => !!(rules.sumFrom && date>=rules.sumFrom);
const ftTotal = r => r.tickets.reduce((a,t)=>a+(+t.ft||0),0);
function repCalc(r){ const b=rateFor(r.date), sm=sumMode(r.date), fsum=ftTotal(r), c=sm?cotas(fsum):r.tickets.reduce((a,t)=>a+cotas(t.ft),0), n=tCount(r); return {n, cotas:c, rate:b, sum:sm, ftSum:fsum, tk:n*rules.ticket, ft:c*b, total:n*rules.ticket+c*b}; }
/* linhas da planilha/PDF para um report (12 colunas do csvHead) */
function tickRows(r){ const c=repCalc(r), ws=weekStart(r.date), dw=DOW(parseISO(r.date).getDay()), out=[];
  r.tickets.forEach(t=>{ const k=cotas(t.ft); out.push(c.sum?[weekNum(ws),r.date,dw,r.loc,t.ticket,+t.ft||0,t.flag,"",c.rate,rules.ticket,"",rules.ticket]:[weekNum(ws),r.date,dw,r.loc,t.ticket,+t.ft||0,t.flag,k,c.rate,rules.ticket,k*c.rate,rules.ticket+k*c.rate]); });
  const ex=c.n-r.tickets.length; if(ex>0) out.push([weekNum(ws),r.date,dw,r.loc,`+${ex} ${T("noFt")}`,0,"",c.sum?"":0,c.rate,ex*rules.ticket,c.sum?"":0,ex*rules.ticket]);
  if(c.sum) out.push([weekNum(ws),r.date,dw,r.loc,T("daySumRow")(rules.size),c.ftSum,"",c.cotas,c.rate,"",c.ft,c.ft]);
  return out; }
const firstWeek = () => weekStart(rules.start || (reports.map(r=>r.date).sort()[0]) || todayISO());
const weekNum = ws => Math.round((parseISO(ws)-parseISO(firstWeek()))/(7*864e5))+1;

/* ---------- leitura do report colado ---------- */
function parseNum(s){
  s=s.trim().replace(/[.,]$/,""); if(!s) return 0;
  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) return parseFloat(s.replace(/\./g,"").replace(",","."));
  if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) return parseFloat(s.replace(/,/g,""));
  return parseFloat(s.replace(",","."))||0;
}
function parseReports(text){
  const out=[]; let cur=null, waDate=null;
  for(let line of text.split(/\r?\n/)){
    const wa=line.match(/\[\s*(\d{1,2})\/(\d{1,2})\/(\d{2,4}),?\s*(\d{1,2}):(\d{2})(?::\d{2})?\s*([AP]M)?\s*\]/i);
    if(wa){
      const y=wa[3].length===2?"20"+wa[3]:wa[3];
      let h=+wa[4]; if(wa[6]) h=h%12+(/pm/i.test(wa[6])?12:0);
      let ds=`${y}-${String(+wa[1]).padStart(2,"0")}-${String(+wa[2]).padStart(2,"0")}`;
      if(h<6) ds=addDays(ds,-1);
      waDate=ds; line=line.slice(wa.index+wa[0].length);
    }
    const h=line.match(/report\s*\|\s*([^|]+?)\s*\|\s*(\d+)\s*tickets?/i);
    if(h){ cur={tech:h[1].trim(), declared:+h[2], rows:[], waDate}; out.push(cur); continue; }
    const t=line.trim().match(/^[^\d\[]*?(\d{10})(.*)$/);
    if(t){
      if(!cur){ cur={tech:perfil?`${perfil.nome} ${perfil.sobrenome}`.trim():"", declared:null, rows:[], waDate}; out.push(cur); }
      const k=t[2].match(/^\s*(\D*?)\s*(\d[\d.,]*)\s*(ft|feet|feets|pés|pies)?\b\s*([\d.,]+)?\s*(.*)$/i);
      let ft=0, flag=t[2].trim();
      if(k){ ft=parseNum(k[2]); flag=(k[1]+" "+k[5]).trim(); }
      cur.rows.push({ticket:t[1], ft, flag:flag.replace(/[\s️]+/g," ").trim()});
    }
  }
  return out.filter(r=>r.rows.length||r.declared);
}

/* ---------- agregações ---------- */
function weekData(ws){
  const reps=reports.filter(r=>weekStart(r.date)===ws);
  const ganho=reps.reduce((a,r)=>a+repCalc(r).total,0), tk=reps.reduce((a,r)=>a+tCount(r),0), nd=new Set(reps.map(r=>r.date)).size;
  const carro=reps.length?rules.car:0, receber=ganho-carro, w=weeks[ws]||{}, paid=(w.paid===0||w.paid)?+w.paid:null;
  return {ws, reps, ganho, tk, nd, carro, receber, paid, diff: paid==null?null:paid-receber};
}
function allWeeks(){ const s=new Set(reports.map(r=>weekStart(r.date))); Object.keys(weeks).forEach(k=>s.add(k)); return [...s].sort(); }
function caixaMoves(){
  const m=[];
  Object.entries(weeks).forEach(([ws,w])=>{ if(w.paid) m.push({id:null,date:w.paidDate||addDays(ws,7),desc:T("weekPay")(weekNum(ws)),amount:+w.paid,auto:true}); });
  caixa.forEach(c=>m.push({...c}));
  m.sort((a,b)=>a.date.localeCompare(b.date)||(b.amount-a.amount));
  let bal=0; m.forEach(x=>{bal+=x.amount; x.bal=bal;}); return m;
}

  <tr class="total"><td></td><td>${c.n} ${T("tickets")}</td><td></td><td class="r num">${fmt(c.ftSum)}</td><td class="r num">${c.cotas}</td><td class="r num">${money(c.tk)}</td><td class="r num">${money(c.ft)}</td><td class="r num money">${money(c.total)}</td></tr></tbody></table></div>`;
}

  const {error}=await sb.from("regras").upsert({user_id:me.id, ticket:rules.ticket, cota_ft:rules.size, carro:rules.car, inicio:rules.start||null, semana_inicio:rules.wd||0, soma_desde:rules.sumFrom||null, valores:rules.rates.map(r=>({desde:r.from, valor:r.block})), atualizado:new Date().toISOString()});
  error?err(error,T("tErr")):toast(T("tRules"));
}
let empresasAll=[];

async function setLang(l){
  if(!I18N[l]) return; lang=l; try{ localStorage.setItem("locator.lang",l); }catch(e){}
  renderAll(); if(!$("#scrWait").hidden) renderWait();

/* ---------- entrada / sessão ---------- */
function waLink(){ const msg={pt:`Olá! Paguei o Locator. Meu e-mail: ${perfil?.email||""}`,en:`Hi! I paid for Locator. My email: ${perfil?.email||""}`,es:`¡Hola! Pagué Locator. Mi correo: ${perfil?.email||""}`}[lang]; return `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`; }
function payHTML(){
  const eq=perfil?.empresa_id && perfil?.papel!=="gerente" && teamSize>=10; const U=eq?PRECO_EQ_USD:PRECO_USD;
  return `<div class="paybox"><div><b>${T("planLine")(U)}</b>${eq?` <span class="chip ok">${T("teamDiscount")}</span>`:""}</div>
  <div class="opt"><b>Zelle — US$ ${U}</b>${T("payZelle")(esc(ZELLE))}</div>
  <p class="note" style="margin:0">${T("payReceipt")}</p>
  <a class="wa" href="${waLink()}" target="_blank" rel="noopener">💬 ${T("waTalk")}</a></div>`;
}
function updateFab(){ const a=$("#waFab"); if(!a) return; const m={pt:"Olá! Tenho uma dúvida sobre o Locator.",en:"Hi! I have a question about Locator.",es:"¡Hola! Tengo una pregunta sobre Locator."}[lang]+(perfil?.email?` (${perfil.email})`:""); a.href=`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(m)}`; }
function renderTrial(){ updateFab();
  const el=$("#trialBar"); if(!el) return;
  if(!perfil || perfil.admin || !perfil.acesso_ate){ el.hidden=true; return; }
  const left=Math.round((parseISO(perfil.acesso_ate)-parseISO(todayISO()))/864e5)+1;
  const isTest=perfil.plano==="teste";
  el.hidden=false; el.classList.toggle("warn", left<=5);
  el.innerHTML=`<span>${isTest?T("trialLeft")(left, dFull(perfil.acesso_ate)):T("accessLeft")(left, dFull(perfil.acesso_ate))}</span><details><summary>${T("howPay")}</summary>${payHTML()}</details>`;
}
function renderWait(){
  if(!perfil) return;
  $("#waitTitle").textContent = perfil.status==="bloqueado" ? T("wTitleBlocked") : (perfil.status==="ativo" ? T("wTitleExpired") : T("wTitlePending"));
  $("#waitText").textContent = T("hello")(perfil.nome||"") + (perfil.status==="pendente" ? T("wPending") : perfil.status==="ativo" ? T("wExpired")(dFull(perfil.acesso_ate)) : T("wBlocked"));
  if(perfil.status==="ativo" && perfil.plano==="teste"){ $("#waitTitle").textContent=T("wTitleTrial"); $("#waitText").textContent=T("hello")(perfil.nome||"")+T("wTrial")(dFull(perfil.acesso_ate)); }
  $("#payInfo").innerHTML = payHTML();
}
function hasSavedLang(){ try{ return !!I18N[localStorage.getItem("locator.lang")]; }catch(e){ return false; } }
async function boot(){
  applyStatic();
  if(!hasSavedLang() && !boot._picked){
    let sess=null; try{ sess=sb?(await sb.auth.getSession()).data.session:null; }catch(e){}
    if(!sess){ show("scrLang"); return; }
  }
  if(!sb){ show("scrAuth"); authMsg(T("aNotConfigured"),"bad"); return; }
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ show("scrAuth"); return; }
  me=session.user;
  const {data,error}=await sb.from("perfis").select("*").eq("id",me.id).maybeSingle();
  if(error||!data){ show("scrAuth"); authMsg(T("aNoProfile"),"bad"); return; }
  perfil=data;
  let saved=null; try{ saved=localStorage.getItem("locator.lang"); }catch(e){}
  if(!saved && perfil.idioma && I18N[perfil.idioma]){ lang=perfil.idioma; applyStatic(); }
  const ativo = perfil.admin || (perfil.status==="ativo" && (!perfil.acesso_ate || perfil.acesso_ate>=todayISO()));
  if(!ativo){ show("scrWait"); renderWait(); return; }
  show("scrApp");
  $("#who").textContent = `${perfil.nome} ${perfil.sobrenome}`.trim();
  renderTrial();
  let seen=false; try{ seen=!!localStorage.getItem("locator.welcome"); }catch(e){}
  if(!seen && !perfil.admin){ $("#welcome").hidden=false; $("#wcTrial").textContent = perfil.plano==="teste"&&perfil.acesso_ate ? T("wcTrialTxt")(dFull(perfil.acesso_ate)) : ""; }
  $("#tabAdmin").hidden = !perfil.admin;
  try{ await loadAll(); }catch(e){ err(e,T("tLoadErr")); }
}
function authMsg(t,kind){ const m=$("#authMsg"); m.hidden=!t; m.className="msg"+(kind?" "+kind:""); m.textContent=t||""; }

$("#swLogin").onclick=()=>{ $("#fLogin").hidden=false; $("#fSign").hidden=true; $("#swLogin").setAttribute("aria-selected","true"); $("#swSign").setAttribute("aria-selected","false"); authMsg(""); };
$("#swSign").onclick=()=>{ $("#fLogin").hidden=true; $("#fSign").hidden=false; $("#swLogin").setAttribute("aria-selected","false"); $("#swSign").setAttribute("aria-selected","true"); authMsg(""); };

$("#recheck").onclick=()=>boot();
$("#wcOk").onclick=()=>{ $("#welcome").hidden=true; try{ localStorage.setItem("locator.welcome","1"); }catch(e){} };
document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=async()=>{ boot._picked=true; await setLang(b.dataset.pick); await boot(); if(/signup/.test(location.search+location.hash)) $("#swSign").click(); });
document.addEventListener("change", e=>{ if(e.target.classList.contains("langSel")) setLang(e.target.value); });
document.addEventListener("click", async e=>{
  if(e.target.closest("[data-logout]")){ await sb?.auth.signOut(); me=null; perfil=null; reports=[]; show("scrAuth"); return; }
});
sb?.auth.onAuthStateChange(async (ev)=>{
  if(ev==="PASSWORD_RECOVERY"){ const p=prompt(T("newPass")); if(p&&p.length>=6){ const {error}=await sb.auth.updateUser({password:p}); toast(error?T("passFail"):T("passChanged")); } }
});
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && me && !$("#scrApp").hidden) loadAll().catch(()=>{}); });

/* ---------- ações no app ---------- */
document.addEventListener("click", async e=>{
  if($("#scrApp").hidden) return;
  const tb=e.target.closest("[data-tab]"); if(tb){ setTab(tb.dataset.tab); return; }
  if(e.target.id==="joinBtn"){ const c=$("#joinCode").value.trim().toUpperCase(); if(!c) return; const {data,error}=await sb.rpc("entrar_equipe",{p_codigo:c}); if(error) return toast(/codigo/.test(error.message)?T("tBadCode"):T("tErr")); toast(T("tJoined")(data)); return boot(); }
  if(e.target.id==="createTeam"){ const n=$("#teamName").value.trim(); if(!n) return toast(T("teamNamePh")); const {error}=await sb.rpc("criar_equipe",{p_nome:n}); if(error) return toast(T("tErr")); toast(T("tTeamCreated")); await boot(); setTab("regras"); return; }
  if(e.target.id==="leaveTeam"){ if(pendingDel!=="leave"){ pendingDel="leave"; e.target.textContent=T("confirm"); setTimeout(()=>{pendingDel=null; renderTeamPanel();},4000); return; } pendingDel=null; const {error}=await sb.rpc("sair_equipe"); if(error) return toast(T("tErr")); toast(T("tLeft")); return boot(); }
  if(e.target.id==="addMember"){ const em=$("#addEmail").value.trim(); if(!em) return; const {data,error}=await sb.rpc("adicionar_membro",{p_email:em});
    if(error) return toast(/nao_encontrado/.test(error.message)?T("tNotFound"):/outra_equipe/.test(error.message)?T("tOtherTeam"):T("tErr"));
    $("#addEmail").value=""; toast(T("tAdded")(data)); loadTeam(); return; }
  if(e.target.id==="copyInvite"){ const txt=T("inviteMsg")(empresa.nome, empresa.codigo, inviteLink()); try{ await navigator.clipboard.writeText(txt); toast(T("tCopied")); }catch(_){ prompt("", txt); } return; }
  if(e.target.id==="tPrev"){ teamWeek=addDays(teamWeek,-7); renderTeam(); return; }
  if(e.target.id==="tNext"){ teamWeek=addDays(teamWeek,7); renderTeam(); return; }
  if(e.target.id==="tXlsx"){ exportTeam("xlsx"); return; }
  if(e.target.id==="tPdf"){ exportTeam("pdf"); return; }
  const tx=e.target.closest("[data-tx]"); if(tx){ const id=tx.dataset.tx; if(!team.reps[id].some(r=>weekStart(r.date)===teamWeek && true)){ const has=withCtx(id,()=>reports.some(r=>weekStart(r.date)===weekStart(teamWeek))); if(!has) return toast(T("noWeeks")); } withCtx(id,()=>exportXLSX(tx.dataset.fmt, "semana", weekStart(teamWeek)), tLocF); return; }
  const rmb=e.target.closest("[data-rm]"); if(rmb){ const id=rmb.dataset.rm; if(pendingDel!==id){ pendingDel=id; renderTeam(); setTimeout(()=>{ if(pendingDel===id){pendingDel=null;renderTeam();} },4000); return; } pendingDel=null; const {error}=await sb.rpc("remover_membro",{alvo:id}); if(error) return toast(T("tErr")); toast(T("tDeleted")); return loadTeam(); }
  const pb=e.target.closest("[data-per]"); if(pb){ per=pb.dataset.per; $("#expPer").value=per; fillExp(); renderResumo(); return; }
  const wk=e.target.closest("[data-week]"); if(wk){ curWeek=wk.dataset.week; setTab("semana"); renderWeek(); return; }
  if(e.target.id==="prevW"){ curWeek=addDays(curWeek,-7); renderWeek(); return; }
  if(e.target.id==="nextW"){ curWeek=addDays(curWeek,7); renderWeek(); return; }
  const day=e.target.closest("[data-day]"); if(day){ const d=day.dataset.day; open.has(d)?open.delete(d):open.add(d); renderWeek(); return; }
  const del=e.target.closest("[data-del]");
  if(del){ const id=del.dataset.del;
    if(pendingDel!==id){ pendingDel=id; renderWeek(); setTimeout(()=>{ if(pendingDel===id){pendingDel=null;renderWeek();} },4000); return; }
    pendingDel=null; const {error}=await sb.from("reports").delete().eq("id",id); if(error) return err(error); reports=reports.filter(r=>r.id!==id); renderAll(); toast(T("tDeleted")); return; }
  const cd=e.target.closest("[data-cxdel]");
  if(cd){ const id=cd.dataset.cxdel;
    if(pendingDel!==id){ pendingDel=id; renderCaixa(); setTimeout(()=>{ if(pendingDel===id){pendingDel=null;renderCaixa();} },4000); return; }
    pendingDel=null; const {error}=await sb.from("caixa").delete().eq("id",id); if(error) return err(error); caixa=caixa.filter(c=>c.id!==id); renderCaixa(); toast(T("tDeleted")); return; }
  const rd=e.target.closest("[data-ratedel]"); if(rd){ rules={...rules, rates:rules.rates.filter(r=>r.from!==rd.dataset.ratedel)}; renderAll(); saveRules(); return; }
  if(e.target.id==="addRate"){ const f=$("#newRateFrom").value, v=parseFloat($("#newRateVal").value);
    if(!f||!(v>=0)) return toast(T("tFillRate"));
    rules={...rules, rates:[...rules.rates.filter(r=>r.from!==f),{from:f,block:v}]}; $("#newRateVal").value=""; renderAll(); saveRules(); return; }
  const er=e.target.closest("[data-editrep]");
  if(er){ const r=reports.find(x=>x.id===er.dataset.editrep); editRep=r.id; editRows=r.tickets.map(t=>({...t})); editDecl=r.declared; renderWeek(); return; }
  const ed=e.target.closest("[data-erdel]"); if(ed){ editRows.splice(+ed.dataset.erdel,1); renderWeek(); return; }
  if(e.target.id==="erAdd"){ editRows.push({ticket:"",ft:"",flag:""}); renderWeek(); const ins=document.querySelectorAll('[data-k="ticket"]'); ins[ins.length-1]?.focus(); return; }
  if(e.target.id==="erCancel"){ editRep=null; renderWeek(); return; }
  if(e.target.id==="erSave"){
    const rows=editRows.map(t=>({ticket:String(t.ticket).replace(/\D/g,""), ft:typeof t.ft==="number"?t.ft:parseNum(String(t.ft||"")), flag:(t.flag||"").trim()})).filter(t=>t.ticket);
    const bad=rows.find(t=>t.ticket.length!==10); if(bad) return toast(T("tTicket10"));
    const d=$("#erDecl").value; const decl=d===""?null:parseInt(d,10);
    const {error}=await sb.from("reports").update({tickets:rows, declarados:decl}).eq("id",editRep); if(error) return err(error);
    const r=reports.find(x=>x.id===editRep); if(r){ r.tickets=rows; r.declared=decl; }
    editRep=null; renderAll(); toast(T("tEdited")); return; }
  if(e.target.id==="clearDraft"){ $("#paste").value=""; drafts=[]; renderDrafts(); return; }
  if(e.target.id==="saveDraft"){
    const date=$("#pDate").value; if(!date) return; const btn=e.target; btn.disabled=true;
    const local=$("#pLoc").value.trim(); saveLoc(local);
    const rows=drafts.map(d=>({user_id:me.id, dia:date, tecnico:d.tech, declarados:d.declared, local, tickets:d.rows}));
    const {error}=await sb.from("reports").insert(rows);
    if(error){ btn.disabled=false; return err(error); }
    const n=drafts.length; curWeek=weekStart(date); open.add(date);
    $("#paste").value=""; drafts=[]; delete $("#pDate").dataset.touched; $("#pDateHint").textContent="";
    await loadAll(); toast(n>1?T("tSavedN")(n):T("tSaved")); return;
  }
  if(e.target.id==="saveMe"){
    const patch={nome:$("#mNome").value.trim(), sobrenome:$("#mSobre").value.trim(), telefone:$("#mTel").value.trim()};
    const {error}=await sb.from("perfis").update(patch).eq("id",me.id); if(error) return err(error);
    perfil={...perfil,...patch}; $("#who").textContent=`${perfil.nome} ${perfil.sobrenome}`.trim(); toast(T("tMe")); return;
  }
  const lib=e.target.closest("[data-lib]");
  if(lib){ const p=perfis.find(x=>x.id===lib.dataset.lib); const base=(p.acesso_ate&&p.acesso_ate>=todayISO())?p.acesso_ate:todayISO();
    return setAccess(p.id,{status:"ativo", plano:"mensal", acesso_ate:addDays(base,30)}, T("tLib")(p.nome, dFull(addDays(base,30)))); }
  const lf=e.target.closest("[data-libfree]"); if(lf) return setAccess(lf.dataset.libfree,{status:"ativo", acesso_ate:null},T("tLibFree"));
  const bl=e.target.closest("[data-block]"); if(bl) return setAccess(bl.dataset.block,{status:"bloqueado"},T("tBlocked"));
  if(e.target.id==="expGo"){ exportXLSX("xlsx"); return; }
  if(e.target.id==="expPdf"){ exportXLSX("pdf"); return; }
  if(e.target.id==="exportBtn"){
    const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
    const L=[T("csvHead").map(q).join(",")];
    [...reports].sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{ const c=repCalc(r), ws=weekStart(r.date), dw=DOW(parseISO(r.date).getDay());
      tickRows(r).forEach(x=>L.push(x.map(q).join(",")));
    });
    L.push(""); L.push(T("csvWeeks").map(q).join(","));
    allWeeks().filter(w=>weekNum(w)>=1).forEach(w=>{ const W=weekData(w); L.push([weekNum(w),w,W.tk,W.ganho,-W.carro,W.receber,W.paid,W.diff].map(q).join(",")); });
    L.push(""); L.push(T("csvCash").map(q).join(","));
    caixaMoves().forEach(x=>L.push([x.date,x.desc,x.amount,x.bal].map(q).join(",")));
    const blob=new Blob(["﻿"+L.join("\n")],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`locator-${todayISO()}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  }
});
document.addEventListener("change", async e=>{
  if($("#scrApp").hidden) return;
  const id=e.target.dataset.edit;
  if(id&&e.target.value){ const {error}=await sb.from("reports").update({dia:e.target.value}).eq("id",id); if(error) return err(error); const r=reports.find(x=>x.id===id); if(r) r.date=e.target.value; renderAll(); toast(T("tDay")); return; }
  const lid=e.target.dataset.editloc;
  if(lid){ const v=e.target.value.trim(); const {error}=await sb.from("reports").update({local:v}).eq("id",lid); if(error) return err(error); const r=reports.find(x=>x.id===lid); if(r) r.loc=v; renderLocList(); renderResumo(); toast("📍 "+(v||"—")); return; }
  if(e.target.id==="paidInput"){
    const v=e.target.value.trim(), ws=curWeek, pago=v===""?null:parseNum(v.replace(/[^\d.,]/g,""));
    const {error}=await sb.from("semanas").upsert({user_id:me.id, inicio:ws, pago}); if(error) return err(error);
    weeks[ws]={...(weeks[ws]||{}), paid:pago}; renderAll(); toast(T("tPaid")); return;
  }
  if(e.target.id==="admFilter"){ renderAdmin(); return; }
  if(e.target.id==="expPer"){ fillExp(); return; }
  if(e.target.id==="tWho"){ tWho=e.target.value; renderTeam(); return; }
  if(e.target.id==="tLocSel"){ tLocF=e.target.value; renderTeam(); return; }
  if(e.target.id==="sameRules"){ const on=e.target.checked; const p=on?{ticket:rules.ticket, cota_ft:rules.size, carro:rules.car, semana_inicio:rules.wd||0, soma_desde:rules.sumFrom||null, valores:rules.rates.map(r=>({desde:r.from, valor:r.block}))}:null; const {error}=await sb.rpc("salvar_regras_equipe",{p}); if(error) return err(error); empresa.regras=p; toast(on?T("tSameOn"):T("tSameOff")); if(!$("#tab-equipe").hidden||team.members.length) loadTeam(); return; }
  if(e.target.id==="rSumOn"){ rules={...rules, sumFrom:e.target.checked?(rules.sumFrom||todayISO()):null}; renderAll(); saveRules(); return; }
  if(e.target.id==="rSumFrom"){ if(!e.target.value) return; rules={...rules, sumFrom:e.target.value}; renderAll(); saveRules(); return; }
  if(e.target.id==="rClose"){ rules={...rules, wd:(+e.target.value+1)%7}; curWeek=weekStart(curWeek); renderAll(); saveRules(); return; }
  const map={rTicket:"ticket",rSize:"size",rCar:"car",rStart:"start"};
  if(map[e.target.id]){ const k=map[e.target.id]; let v=e.target.value;
    if(k!=="start"){ v=parseFloat(v); if(!(v>=0)||(k==="size"&&!(v>=1))) return; } else if(!v) v=null;
    rules={...rules,[k]:v}; renderAll(); saveRules(); }
});
$("#paste").addEventListener("input", e=>{
  drafts=parseReports(e.target.value);
  const wd=drafts.find(d=>d.waDate)?.waDate;
  if(wd&&!$("#pDate").dataset.touched){ $("#pDate").value=wd; $("#pDateHint").textContent=T("waDate"); }
