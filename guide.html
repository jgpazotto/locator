<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How to use Locator</title>
<meta name="description" content="Step-by-step guide to Locator: create your account, paste your daily report, check your pay and send the weekly report to your company.">
<meta name="theme-color" content="#e0600f">
<link rel="icon" href="app/icon-192.png?v=2">
<link rel="apple-touch-icon" href="app/icon-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f7f4ee; --panel:#ffffff; --ink:#1d2126; --muted:#5f656b; --line:#e2ddd3;
  --accent:#e0600f; --accent-ink:#b84c08; --accent-soft:#fbe7d8; --dark:#1d2126;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#15181b; --panel:#1e2226; --ink:#eceae4; --muted:#a3a9ae; --line:#33383d;
    --accent:#f7843a; --accent-ink:#f7843a; --accent-soft:#3a2618; --dark:#0f1113; }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:40px;height:40px;border-radius:10px}
.brand b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.brand b span{color:var(--accent)}
.nav{display:flex;align-items:center;gap:10px}
.lang{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;border-radius:999px;padding:6px 10px;font:600 14px var(--sans);color:var(--ink);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:10px;font-weight:700;text-decoration:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
.btn.sm{padding:8px 14px;font-size:15px}

.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:36px 0 56px}
.eyebrow{display:inline-block;font:600 13px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);padding:6px 10px;border-radius:6px}
h1{font-size:clamp(34px,5.4vw,56px);line-height:1.05;letter-spacing:-.03em;margin:16px 0 14px;font-weight:800;text-wrap:balance}
.lead{font-size:19px;color:var(--muted);max-width:34em;margin:0 0 24px}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cta .note{color:var(--muted);font-size:14px;width:100%}

/* mini app preview */
.phone{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 20px 50px -24px rgba(0,0,0,.25)}
.phone .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.phone .ph b{font-size:15px}
.phone .ph small{font:12px var(--mono);color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile small{display:block;font:600 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tile b{font:600 20px var(--mono)}
.tile.hl b{color:var(--accent)}
.rep{font:13px/1.7 var(--mono);background:var(--bg);border-radius:10px;padding:10px 12px;color:var(--muted)}
.rep .t{color:var(--ink)}
.demo-note{font-size:12px;color:var(--muted);margin:8px 2px 0}

section{padding:56px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(26px,3.4vw,36px);letter-spacing:-.02em;line-height:1.1;margin:0 0 10px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 28px;max-width:40em}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:s}
.step{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.step::before{counter-increment:s;content:counter(s);display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;margin-bottom:12px}
.step h3{margin:0 0 6px;font-size:19px}
.step p{margin:0;color:var(--muted);font-size:16px}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.feat{padding:18px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.feat .ic{font-size:22px}
.feat h3{margin:8px 0 4px;font-size:17px}
.feat p{margin:0;color:var(--muted);font-size:15px}

.price{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
.card{background:var(--panel);border:2px solid var(--accent);border-radius:20px;padding:28px}
.card .amt{font:800 56px/1 var(--sans);letter-spacing:-.03em}
.card .amt small{font-size:18px;font-weight:600;color:var(--muted);letter-spacing:0}
.card ul{list-style:none;padding:0;margin:18px 0 22px}
.card li{padding:6px 0 6px 28px;position:relative}
.card li::before{content:"✓";position:absolute;left:0;color:var(--accent);font-weight:800}
.how-pay{color:var(--muted)}
.brl{margin:6px 0 0;color:var(--muted);font-size:15px}
.wa{display:inline-flex;align-items:center;gap:8px;margin-top:16px;background:#25d366;color:#fff;border-radius:10px;padding:12px 18px;font-weight:700;text-decoration:none}
.how-pay ol{padding-left:20px;margin:10px 0 0}
.how-pay li{margin:6px 0}

.faq details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:10px}
.faq summary{font-weight:700;cursor:pointer}
.faq p{margin:8px 0 0;color:var(--muted)}

footer{padding:30px 0 50px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

@media (max-width:820px){
  .hero,.price{grid-template-columns:1fr}
  .steps,.feats{grid-template-columns:1fr}
  .nav .btn.ghost{display:none}
  .hero{padding-top:16px}
}
@media (max-width:420px){ .lang button{padding:6px 8px} .brand b{font-size:21px} }

.guide{padding:24px 0 40px;max-width:820px}
.guide h1{font-size:clamp(32px,5vw,48px)}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 8px}
.toc a{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);text-decoration:none;font-weight:600;font-size:14px}
.toc a:hover{border-color:var(--accent)}
.guide section{padding:36px 0 8px}
.gsteps{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-direction:column;gap:12px}
.gsteps li{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.gsteps .num{flex:0 0 34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
.gsteps h3{margin:4px 0 4px;font-size:18px}
.gsteps p{margin:0;color:var(--muted);font-size:16px;line-height:1.55}
.gsteps b{color:var(--ink)}
.k{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:14px;background:var(--bg)}
.help{border-top:1px solid var(--line);margin-top:28px}
</style>
</head>

function pick(){ let l=null; try{ l=localStorage.getItem("locator.lang"); }catch(e){} return G[l]?l:"en"; }
function apply(l){
  const D=G[l]; document.documentElement.lang = l==="pt"?"pt-BR":l;
  document.querySelectorAll("[data-t]").forEach(el=>{ if(D[el.dataset.t]!=null) el.textContent=D[el.dataset.t]; });
  document.querySelectorAll("[data-l]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===l)));
  document.getElementById("toc").innerHTML=D.sec.map(x=>`<a href="#${x.id}">${x.t}</a>`).join("");
  let n=0;
  document.getElementById("sections").innerHTML=D.sec.map(x=>`<section id="${x.id}"><h2>${x.t}</h2><ol class="gsteps">${x.steps.map(([h,p])=>`<li><div class="num">${++n}</div><div><h3>${h}</h3><p>${p}</p></div></li>`).join("")}</ol></section>`).join("");
  document.title = D.title;
}
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ try{ localStorage.setItem("locator.lang",b.dataset.l); }catch(e){} apply(b.dataset.l); });
apply(pick());
